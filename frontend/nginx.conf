# Sirve la aplicacion ya compilada y reenvia /graphql al gateway.
#
# Gracias a este reenvio, el navegador solo habla con un origen y no hay
# problema de CORS. Tambien significa que el frontend no necesita saber la
# direccion del gateway: siempre llama a la ruta relativa /graphql.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /graphql {
        proxy_pass http://gateway-graphql:8000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router maneja las rutas del lado del navegador. Cualquier ruta
    # que no sea un archivo debe devolver index.html para que la aplicacion
    # decida que pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
