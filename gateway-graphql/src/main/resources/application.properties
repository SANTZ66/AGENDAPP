# gateway-graphql

spring.application.name=gateway-graphql
server.port=8000

# --- GraphQL ---
# Interfaz interactiva para probar consultas: http://localhost:8000/graphiql
spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql

# --- Sesion del panel del establecimiento (JWT) ---
# El valor por defecto es SOLO para desarrollo: en un entorno real se define
# JWT_SECRET (minimo 32 caracteres). Duracion de la sesion en minutos.
app.jwt.secreto=${JWT_SECRET:clave-de-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.minutos=${JWT_MINUTOS:480}

# --- Servicios internos a los que consulta ---
app.servicios.establecimientos=${ESTABLECIMIENTOS_URL:http://localhost:8081}
app.servicios.agenda=${AGENDA_URL:http://localhost:8080}
app.servicios.operaciones=${OPERACIONES_URL:http://localhost:8082}
app.servicios.relacion=${RELACION_URL:http://localhost:8083}
