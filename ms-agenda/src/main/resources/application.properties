# ms-agenda - configuracion principal

spring.application.name=ms-agenda

# --- Base de datos (PostgreSQL) ---
# Valores por defecto para correr en local; docker-compose los sobrescribe.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citas}
spring.datasource.username=${DB_USER:citas}
spring.datasource.password=${DB_PASSWORD:citas}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# El esquema 'agenda' lo crea el contenedor de Postgres (db-init/01-schema.sql)
# antes de que arranque la app. Hibernate solo crea/actualiza las tablas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=agenda
spring.jpa.open-in-view=false
# Si el esquema no existe todavia, que Hibernate lo cree. Asi el servicio
# arranca aunque el volumen de Postgres ya existiera de antes y el script
# de db-init no se haya vuelto a ejecutar.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# --- Documentacion OpenAPI ---
# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# --- Bus de eventos (Kafka) ---
# kafka:29092 desde otro contenedor, localhost:9092 desde el equipo.
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Si el broker no responde, fallar rapido en vez de bloquear la peticion.
spring.kafka.producer.properties.max.block.ms=5000

# Permite apagar la publicacion en las pruebas.
app.eventos.habilitados=true
