# Perfil de pruebas: base H2 en memoria, sin Docker.
spring.datasource.url=jdbc:h2:mem:agenda;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS agenda
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=agenda

# El esquema 'agenda' se crea en la propia URL de conexion (parametro INIT),
# de modo que existe antes de que Hibernate cree las tablas.

# Las pruebas no necesitan un Kafka levantado.
app.eventos.habilitados=false
spring.kafka.bootstrap-servers=localhost:9092
