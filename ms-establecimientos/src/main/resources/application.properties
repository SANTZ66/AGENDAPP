# ms-establecimientos

spring.application.name=ms-establecimientos
server.port=8081

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citas}
spring.datasource.username=${DB_USER:citas}
spring.datasource.password=${DB_PASSWORD:citas}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# El esquema lo crea el contenedor de Postgres (db-init). Hibernate solo
# crea o actualiza las tablas dentro de el.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=establecimientos
spring.jpa.open-in-view=false
# Si el esquema no existe todavia, que Hibernate lo cree. Asi el servicio
# arranca aunque el volumen de Postgres ya existiera de antes y el script
# de db-init no se haya vuelto a ejecutar.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# --- Usuario de prueba del panel ---
# Solo para desarrollo. Ver SembradoUsuarios. En un entorno real: activa=false.
app.auth.semilla.activa=${SEMILLA_USUARIO_ACTIVA:true}
app.auth.semilla.correo=${SEMILLA_USUARIO_CORREO:admin@demo.com}
app.auth.semilla.clave=${SEMILLA_USUARIO_CLAVE:demo1234}

# --- Documentacion ---
springdoc.swagger-ui.path=/swagger-ui.html
