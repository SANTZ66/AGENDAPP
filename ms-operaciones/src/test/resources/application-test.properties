# Perfil de pruebas de ms-operaciones.
#
# No necesita Docker: la base es H2 en memoria y el broker de Kafka lo
# levanta @EmbeddedKafka dentro de la misma JVM del test.

# --- Base de datos en memoria ---
# El esquema se crea en la propia URL (parametro INIT), de modo que existe
# antes de que Hibernate cree las tablas.
spring.datasource.url=jdbc:h2:mem:operaciones;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS operaciones
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=operaciones

# --- Kafka embebido ---
# @EmbeddedKafka publica la direccion del broker en esta propiedad del
# sistema; aqui se la pasamos a Spring Kafka.
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.auto-offset-reset=earliest

# --- Servicio externo ---
# En las pruebas no hay ms-establecimientos levantado. CatalogoClient
# atrapa el fallo y devuelve una receta vacia, asi que la liquidacion se
# registra igual y la prueba no depende de otro servicio.
app.establecimientos.url=http://localhost:19999
