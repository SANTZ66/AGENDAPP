# ms-relacion-cliente

spring.application.name=ms-relacion-cliente
server.port=8083

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citas}
spring.datasource.username=${DB_USER:citas}
spring.datasource.password=${DB_PASSWORD:citas}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=relacion_cliente
spring.jpa.open-in-view=false
# Si el esquema no existe todavia, que Hibernate lo cree. Asi el servicio
# arranca aunque el volumen de Postgres ya existiera de antes y el script
# de db-init no se haya vuelto a ejecutar.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# --- Kafka ---
# Consume cuatro topics. No produce ninguno.
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=relacion-cliente
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Aunque este servicio no publica eventos de negocio, SI escribe en los
# topics .DLT cuando un mensaje no se puede procesar. Por eso necesita
# serializadores de productor.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Negocio ---
# Cada cuantos dias se recontacta al cliente despues de una visita.
app.recurrencia.dias=28

# --- Servicios a los que consulta (REST sincrono) ---
# Para saber que citas estan por llegar y cuanta ventana de confirmacion tiene
# cada establecimiento. Desde un contenedor, docker-compose los sobrescribe.
app.agenda.url=${AGENDA_URL:http://localhost:8080}
app.establecimientos.url=${ESTABLECIMIENTOS_URL:http://localhost:8081}

# --- Recordatorios de citas ---
# Encendidos por defecto. Se apagan con RECORDATORIOS_ACTIVO=false.
app.recordatorios.activo=${RECORDATORIOS_ACTIVO:true}
# Cada cuantos milisegundos se revisan las citas proximas.
app.recordatorios.cada-ms=${RECORDATORIOS_CADA_MS:60000}
# Espera antes de la primera revision, para que los demas servicios ya esten arriba.
app.recordatorios.espera-inicial-ms=${RECORDATORIOS_ESPERA_INICIAL_MS:30000}

# --- Documentacion ---
springdoc.swagger-ui.path=/swagger-ui.html
