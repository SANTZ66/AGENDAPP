# simulador

spring.application.name=simulador
server.port=8084

# --- Que tan rapido genera actividad ---
# activo:            enciende o apaga la generacion
# espera-inicial-ms: cuanto espera al arrancar, para dar tiempo a que los
#                    servicios esten listos
# intervalo-ms:      cada cuanto genera una cita nueva
app.simulador.activo=${SIMULADOR_ACTIVO:false}
app.simulador.espera-inicial-ms=30000
app.simulador.intervalo-ms=${SIMULADOR_INTERVALO_MS:15000}

# --- APIs que invoca ---
app.establecimientos.url=${ESTABLECIMIENTOS_URL:http://localhost:8081}
app.agenda.url=${AGENDA_URL:http://localhost:8080}
app.operaciones.url=${OPERACIONES_URL:http://localhost:8082}
